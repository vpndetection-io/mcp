name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance, which attests that this artifact was built
      # from this commit in this repo. Free on public repositories.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The tag only TRIGGERS this; npm publishes whatever package.json says.
      # Without this check, tagging v1.0.1 against a 1.0.0 manifest silently
      # republishes 1.0.0, or fails as "already published" with a confusing message.
      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ] ; then
            echo "tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi
      - run: pnpm run test
      - run: pnpm publish --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance, which attests that this artifact was built
      # from this commit in this repo. Free on public repositories.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The tag only TRIGGERS this; npm publishes whatever package.json says.
      # Without this check, tagging v1.0.1 against a 1.0.0 manifest silently
      # republishes 1.0.0, or fails as "already published" with a confusing message.
      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ] ; then
            echo "tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi
      - run: pnpm run test
      - run: pnpm publish --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Lists the version just published in the official MCP registry (registry.modelcontextprotocol.io),
  # which VS Code, GitHub's MCP list and the directories that mirror it read. The registry checks
  # the npm package's mcpName against server.json's name, so it waits for npm to serve the version.
  # GitHub OIDC is what proves this repo owns the io.github.vpndetection-io namespace: no secret.
  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Wait for npm to serve this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for _ in $(seq 60) ; do
            if [ "$(npm view "vpndetection-mcp@${version}" mcpName 2> /dev/null)" = "$(jq -r .name server.json)" ] ; then
              exit 0
            fi
            sleep 10
          done
          echo "npm never served vpndetection-mcp@${version} with its mcpName" >&2
          exit 1
      - name: Publish server.json
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar -xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  # This version's section of CHANGELOG.md, as the tag's GitHub Release. It
  # waits for the publish, so no release page names a version the registry
  # cannot serve, and a re-run edits the release rather than failing on it.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: GitHub Release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{ if (found) exit; found = ($2 == v); next } found' CHANGELOG.md > notes.md
          if ! grep -q '^### ' notes.md ; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
